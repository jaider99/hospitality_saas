version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: hospitality-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospitality
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Vector Database for AI embeddings
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: hospitality-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # In-memory Caching
  redis:
    image: redis:7-alpine
    container_name: hospitality-redis
    restart: always
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data

  # Object Storage
  minio:
    image: minio/minio
    container_name: hospitality-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9012:9000"
      - "9013:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Authentication Core (SuperTokens Self-Hosted)
  supertokens:
    image: supertokens/supertokens-postgresql
    container_name: hospitality-supertokens
    restart: always
    depends_on:
      - postgres
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://postgres:postgres@hospitality-postgres:5432/hospitality"

  # Backend API
  backend:
    build: .
    container_name: hospitality-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@hospitality-postgres:5432/hospitality?schema=public"
      QDRANT_URL: "http://hospitality-qdrant:6333"
      REDIS_URL: "redis://hospitality-redis:6379"
      MINIO_ENDPOINT_URL: "http://hospitality-minio:9000"
      SUPERTOKENS_CONNECTION_URI: "http://hospitality-supertokens:3567"
    depends_on:
      - postgres
      - qdrant
      - redis
      - minio
      - supertokens

  # ARQ Worker
  worker:
    build: .
    container_name: hospitality-worker
    restart: always
    command: python -m arq app.worker.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@hospitality-postgres:5432/hospitality?schema=public"
      QDRANT_URL: "http://hospitality-qdrant:6333"
      REDIS_URL: "redis://hospitality-redis:6379"
      MINIO_ENDPOINT_URL: "http://hospitality-minio:9000"
      SUPERTOKENS_CONNECTION_URI: "http://hospitality-supertokens:3567"
    depends_on:
      - postgres
      - qdrant
      - redis
      - minio

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
